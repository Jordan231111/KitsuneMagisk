name: Kitsune CI

on:
  pull_request:
  push:
    branches:
      - dev
      - kitsune
      - next-system
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kitsune-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Source checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check changed-line whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BEFORE_SHA..$HEAD_SHA"
          else
            git show --check --format= "$HEAD_SHA"
          fi

      - name: Parse shell scripts
        run: |
          while IFS= read -r -d '' file; do
            echo "bash -n $file"
            bash -n "$file"
          done < <(git ls-files -z '*.sh')

      - name: Parse Python sources
        run: |
          while IFS= read -r -d '' file; do
            echo "parse $file"
            python3 -c 'import ast, pathlib, sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(), filename=sys.argv[1])' "$file"
          done < <(git ls-files -z '*.py')

      - name: Run host contract and migration tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  build:
    name: Build and JVM tests
    runs-on: ubuntu-latest
    needs: static
    env:
      SCCACHE_DIRECT: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Create isolated ephemeral release signer
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          signing_pass="$(openssl rand -hex 24)"
          signing_store="$RUNNER_TEMP/kitsune-ci-release.jks"
          signing_config="$RUNNER_TEMP/kitsune-ci-release.prop"
          keytool -genkeypair -noprompt \
            -keystore "$signing_store" \
            -storepass "$signing_pass" \
            -keypass "$signing_pass" \
            -alias kitsune-ci \
            -keyalg RSA \
            -keysize 4096 \
            -validity 2 \
            -dname "CN=Ephemeral Kitsune CI"
          {
            printf 'keyStore=%s\n' "$signing_store"
            printf 'keyStorePass=%s\n' "$signing_pass"
            printf 'keyAlias=kitsune-ci\n'
            printf 'keyPass=%s\n' "$signing_pass"
          } > "$signing_config"
          printf 'RELEASE_CONFIG=%s\n' "$signing_config" >> "$GITHUB_ENV"

      - name: Build release
        run: ./build.py -vr -c "$RELEASE_CONFIG" all

      - name: Build debug
        run: ./build.py -v all

      - name: Run JVM unit tests and Android lint
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:shared:lintDebug
          :stub:lintDebug
          -PconfigPath="$RUNNER_TEMP/no-config.prop"

      - name: Verify APK signer and 16 KiB ELF/ZIP contracts
        run: >-
          python3 -m tools.security_lab.artifact_contract
          --apksigner "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          --apk out/app-debug.apk
          --apk out/stub-debug.apk
          --apk out/app-release.apk
          --apk out/stub-release.apk
          --reject-certificate a9342f305e5d7ecc0245f86c931226267389358c48139f5d7ed6a80cd4329629
          --output out/artifact-contract.json

      - name: Stop Gradle daemon
        if: always()
        run: ./gradlew --stop

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.sha }}
          path: out
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

      - name: Upload mapping and native debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.sha }}-symbols
          path: app/build/outputs
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

  emulator:
    name: AVD API ${{ matrix.api }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: [23, 29, 35]

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.sha }}
          path: out

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Patch, boot, and test AVD
        run: scripts/avd_test.sh ${{ matrix.api }}

  product-gate:
    name: Product gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - static
      - build
      - emulator
    steps:
      - name: Require every product check
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          EMULATOR_RESULT: ${{ needs.emulator.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$EMULATOR_RESULT" = success

name: Magisk CI

on:
  push:
    branches: 
      - dev
      - kitsune
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Magisk artifacts
    runs-on: ubuntu-latest
    env:
      SCCACHE_DIRECT: false
    strategy:
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Build release
        run: ./build.py -vr all

      - name: Build debug
        run: ./build.py -v all

      - name: Stop gradle daemon
        run: ./gradlew --stop

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}
          path: out
          compression-level: 9

      - name: Upload mapping and native debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-symbols
          path: app/build/outputs
          compression-level: 9

      - name: Publish rolling release
        if: github.ref == 'refs/heads/kitsune' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kitsune-rolling
          name: Kitsune Magisk (rolling)
          prerelease: true
          fail_on_unmatched_files: false
          body: |
            Rolling build from `kitsune` @ ${{ github.sha }}.
            Universal APKs (armeabi-v7a, arm64-v8a, x86, x86_64).

            - `app-release.apk` — release build
            - `app-debug.apk` — debug build (verbose logging)

            Built-in Zygisk is removed for security (commit 2ef8f00); use ReZygisk.
          files: |
            out/app-release.apk
            out/app-debug.apk
            out/stub-release.apk
            out/stub-debug.apk


  test:
    name: Test on API ${{ matrix.api }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: [23, 29, 35]

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.sha }}
          path: out

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD test
        run: scripts/avd_test.sh ${{ matrix.api }}
